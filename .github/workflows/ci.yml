name: Android CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  lint:
    name: Run Lint Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run ktlint
        run: ./gradlew ktlintCheck

      - name: Run Android Lint - Internet App
        run: ./gradlew :internet-app:app:lintDebug

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            location-app/app/build/reports/lint-results-debug.html
            internet-app/app/build/reports/lint-results-debug.html

  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Location App Unit Tests
        run: ./gradlew :location-app:app:testDebugUnitTest

      - name: Run Internet App Unit Tests
        run: ./gradlew :internet-app:app:testDebugUnitTest

      - name: Generate Test Coverage Report
        run: ./gradlew jacocoTestReport

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            location-app/app/build/reports/tests/
            internet-app/app/build/reports/tests/
            location-app/app/build/reports/jacoco/
            internet-app/app/build/reports/jacoco/

      - name: Comment Coverage on PR
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.6
        with:
          paths: |
            location-app/app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml,
            internet-app/app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 80
          min-coverage-changed-files: 80

  instrumentation-tests:
    name: Run Instrumentation Tests
    runs-on: macos-13
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [33]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Free Disk Space
        run: |
          df -h
          sudo rm -rf /Users/runner/Library/Android/sdk/ndk
          sudo rm -rf /Users/runner/Library/Android/sdk/ndk-bundle
          df -h

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-macos-13-${{ matrix.api-level }}-v4

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: Nexus 6
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8192M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-load
          disable-animations: true
          enable-hw-keyboard: true
          script: echo "Generated AVD snapshot for caching."

      - name: Run Instrumentation Tests - Location App
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 25
        continue-on-error: false
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: Nexus 6
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8192M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          disable-animations: true
          enable-hw-keyboard: true
          emulator-boot-timeout: 600
          script: |
            adb devices
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            ./gradlew :location-app:app:connectedDebugAndroidTest --stacktrace --info

      - name: Run Instrumentation Tests - Internet App
        if: success() || failure()
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 25
        continue-on-error: false
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: Nexus 6
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8192M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          disable-animations: true
          enable-hw-keyboard: true
          emulator-boot-timeout: 600
          script: |
            adb devices
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            ./gradlew :internet-app:app:connectedDebugAndroidTest --stacktrace --info

      - name: Upload Instrumentation Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-test-reports-api-${{ matrix.api-level }}
          path: |
            location-app/app/build/reports/androidTests/
            internet-app/app/build/reports/androidTests/

  build:
    name: Build APKs
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK - Location App
        run: ./gradlew :location-app:app:assembleDebug

      - name: Build Debug APK - Internet App
        run: ./gradlew :internet-app:app:assembleDebug

      - name: Upload Location App APK
        uses: actions/upload-artifact@v4
        with:
          name: location-app-debug
          path: location-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Internet App APK
        uses: actions/upload-artifact@v4
        with:
          name: internet-app-debug
          path: internet-app/app/build/outputs/apk/debug/app-debug.apk

  static-analysis:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Detekt
        run: ./gradlew detekt

      - name: Upload Detekt Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: |
            location-app/app/build/reports/detekt/
            internet-app/app/build/reports/detekt/

  dependency-check:
    name: Dependency Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check for dependency updates
        run: ./gradlew dependencyUpdates

      - name: Upload Dependency Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: build/dependencyUpdates/

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, instrumentation-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK - Location App
        run: ./gradlew :location-app:app:assembleRelease

      - name: Build Release APK - Internet App
        run: ./gradlew :internet-app:app:assembleRelease

      - name: Get version name
        id: version
        run: echo "VERSION=$(grep 'versionName' location-app/app/build.gradle.kts | awk '{print $3}' | tr -d '\"')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Release v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          files: |
            location-app/app/build/outputs/apk/release/app-release.apk
            internet-app/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify Build Status
    runs-on: ubuntu-latest
    needs: [ lint, unit-tests, build, static-analysis ]
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.lint.result }}" == "failure" ] || [ "${{ needs.unit-tests.result }}" == "failure" ] || [ "${{ needs.build.result }}" == "failure" ]; then
            echo "Build failed!"
            exit 1
          else
            echo "Build successful!"
          fi